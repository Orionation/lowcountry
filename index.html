<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Lowcountry — Orion &amp; The Holy City Band</title>
<meta property="og:title" content="Lowcountry"><meta property="og:type" content="music.album">
<meta property="og:image" content="cover.png">
<meta property="og:description" content="A ten-song record about Charleston, South Carolina.">
<style>
:root{--ink:#2c1e16;--bg:#f6ecdd;--card:#fffaf2;--accent:#c05a30;--dim:rgba(44,30,22,.55)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
 font:16px/1.55 ui-serif,Georgia,'Times New Roman',serif;
 display:flex;justify-content:center;padding:28px 14px 130px}
.wrap{max-width:540px;width:100%}
.art{position:relative;border-radius:6px;overflow:hidden;box-shadow:0 18px 50px rgba(44,30,22,.3)}
.art img{width:100%;display:block}
h1{font-size:clamp(30px,9vw,44px);letter-spacing:.15em;text-transform:uppercase;
 margin:24px 0 4px;font-weight:600;line-height:1}
.by{color:var(--dim);font-size:14px;letter-spacing:.08em;margin-bottom:6px}
.blurb{color:var(--dim);font-size:14px;font-style:italic;margin-bottom:22px}
ol{list-style:none;padding:0;margin:0;background:var(--card);border-radius:6px;overflow:hidden}
li{display:flex;gap:13px;align-items:center;padding:14px 15px;cursor:pointer;
 border-bottom:1px solid rgba(44,30,22,.08)}
li:last-child{border-bottom:0}
li:active{background:rgba(192,90,48,.12)}
.n{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums;min-width:20px}
.ti{flex:1;font-size:17px}
.du{color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
li.on{background:rgba(192,90,48,.13)}
li.on .ti{color:var(--accent);font-weight:700}
li.on .n::before{content:"\25B6";color:var(--accent)}
li.on .n{font-size:11px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);
 border-top:1px solid rgba(44,30,22,.14);padding:11px 14px calc(11px + env(safe-area-inset-bottom));
 box-shadow:0 -8px 26px rgba(44,30,22,.13)}
.bin{max-width:540px;margin:0 auto;display:flex;align-items:center;gap:14px}
.now{flex:1;min-width:0}
.now b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now span{font-size:12px;color:var(--dim)}
button{background:none;border:0;color:var(--ink);font-size:23px;cursor:pointer;
 padding:6px 9px;line-height:1;border-radius:50%}
button:active{background:rgba(44,30,22,.09)}
#pp{font-size:28px}
progress{width:100%;height:4px;margin-top:9px;display:block;
 accent-color:var(--accent);border:0;background:rgba(44,30,22,.13);border-radius:2px}
a{color:var(--accent)}
footer{margin-top:26px;font-size:13px;color:var(--dim);text-align:center}
</style></head><body><div class=wrap>
<div class=art><img src="cover.png" alt="Lowcountry album cover"></div>
<h1>Lowcountry</h1>
<div class=by>Orion &amp; The Holy City Band &middot; 2026</div>
<div class=blurb>Ten songs about Charleston, South Carolina.</div>
<ol id=list></ol>
<footer><a href="lyrics.txt">Lyrics</a></footer></div>
<div class=bar><div class=bin>
 <button id=prev title=Previous>&#9664;&#9664;</button>
 <button id=pp title="Play/Pause">&#9654;</button>
 <button id=next title=Next>&#9654;&#9654;</button>
 <div class=now><b id=nt>&mdash;</b><span id=ns>Tap a track to start</span></div>
</div><div class=bin><progress id=pr value=0 max=100></progress></div></div>
<script>
let T=[],i=0;const a=new Audio();a.preload='metadata';
const L=document.getElementById('list'),PP=document.getElementById('pp'),
 NT=document.getElementById('nt'),NS=document.getElementById('ns'),PR=document.getElementById('pr');
fetch('tracks.json').then(r=>r.json()).then(d=>{T=d;
 L.innerHTML=T.map((t,k)=>`<li data-k="${k}"><span class=n>${t.n}</span><span class=ti>${t.title}</span><span class=du>${t.dur}</span></li>`).join('');
 [...L.children].forEach(li=>li.onclick=()=>load(+li.dataset.k,true));
 NT.textContent=T[0].title;NS.textContent='Track 1 of '+T.length;});
function load(k,play){i=(k+T.length)%T.length;a.src=T[i].src;
 [...L.children].forEach((li,n)=>li.classList.toggle('on',n===i));
 NT.textContent=T[i].title;NS.textContent=`Track ${i+1} of ${T.length}`;
 if('mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata(
  {title:T[i].title,artist:'Orion & The Holy City Band',album:'Lowcountry',
   artwork:[{src:'cover.png',sizes:'1024x1024',type:'image/png'}]});
 if(play)a.play();}
PP.onclick=()=>{if(!a.src)return load(0,true);a.paused?a.play():a.pause();};
document.getElementById('next').onclick=()=>load(i+1,true);
document.getElementById('prev').onclick=()=>{if(a.currentTime>3){a.currentTime=0;}else load(i-1,true);};
a.onplay=()=>PP.innerHTML='&#10073;&#10073;';a.onpause=()=>PP.innerHTML='&#9654;';
a.onended=()=>{if(i<T.length-1)load(i+1,true);else{a.currentTime=0;PP.innerHTML='&#9654;';}};
a.ontimeupdate=()=>{if(a.duration)PR.value=100*a.currentTime/a.duration;};
PR.onclick=e=>{if(a.duration)a.currentTime=a.duration*(e.offsetX/PR.clientWidth);};
if('mediaSession' in navigator){navigator.mediaSession.setActionHandler('nexttrack',()=>load(i+1,true));
 navigator.mediaSession.setActionHandler('previoustrack',()=>load(i-1,true));}
</script></body></html>
